name: CI

"on":
  push:
    branches: ["**"]
  pull_request:

jobs:
  lockfile-check:
    name: lockfile-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Recompile lockfiles and diff against committed versions
        run: |
          cp -r requirements /tmp/requirements-committed
          for extra in dev postgres redis; do
            pip-compile --quiet --strip-extras --extra "$extra" \
              -o "requirements/$extra.txt" pyproject.toml
          done
          diff -u /tmp/requirements-committed/dev.txt requirements/dev.txt
          diff -u /tmp/requirements-committed/postgres.txt requirements/postgres.txt
          diff -u /tmp/requirements-committed/redis.txt requirements/redis.txt

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dev dependencies
        run: pip-audit -r requirements/dev.txt

      - name: Audit postgres extra
        run: pip-audit -r requirements/postgres.txt

      - name: Audit redis extra
        run: pip-audit -r requirements/redis.txt

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Run ruff
        run: ruff check skewproof tests

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Install mypy
        run: pip install mypy==2.3.1

      - name: Run mypy
        run: mypy skewproof

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Run pytest
        run: pytest

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lockfile-check, dependency-audit, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install build tooling
        run: pip install build==1.5.0 twine==7.0.0

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) - no stored secret needed.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # One-time setup before this job can run: register this repo/workflow
      # as a Trusted Publisher for the "skewproof" project on PyPI (Publishing
      # tab on the project page), scoped to this workflow filename and the
      # "pypi" environment above. No PyPI secret needs to be created or
      # stored - PyPI exchanges this job's OIDC token for a short-lived
      # upload credential at publish time. See:
      # https://docs.pypi.org/trusted-publishers/adding-a-publisher/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
