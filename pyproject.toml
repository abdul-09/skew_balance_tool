[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skewproof"
version = "0.1.0"
description = "Define a feature once; the same definition serves training and inference."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
skewproof = "skewproof.cli:entrypoint"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16",
]
postgres = [
    "psycopg2-binary>=2.9,<3",
]
redis = [
    "redis>=5,<9",
]

[tool.setuptools.packages.find]
include = ["skewproof*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, and import sorting: a solid baseline that
# catches real bugs without imposing a broader style migration (e.g.
# timezone-aware datetimes, typing modernization) as part of adding CI.
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=skewproof",
    "--cov-report=term-missing",
    "--cov-branch",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["skewproof"]

[tool.coverage.report]
show_missing = true
omit = ["skewproof/__init__.py"]
exclude_lines = [
    "pragma: no cover",
    # Protocol / interface method bodies that are never executed.
    "^\\s*\\.\\.\\.$",
]
