[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skewproof"
version = "0.1.0"
description = "Define a feature once; the same definition serves training and inference."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

# Deliberately empty, not incomplete: the core package (definition/offline/online/
# materialize/csv_source/sqlite_store/serve/cli) only imports the standard library.
# psycopg2 and redis are never imported at module level anywhere in skewproof - see
# sql_source.py and redis_store.py, which depend only on a Protocol shape (the
# minimal method signature a real client satisfies), not the client library itself.
# doctor.py is the one exception: it does a real, deferred `import psycopg2`/`import
# redis` inside its check functions specifically to do a live connectivity check, and
# handles the ImportError itself when the corresponding extra isn't installed - see
# doctor.py's module docstring and the mypy override below. Those two packages
# belong under [project.optional-dependencies], as extras, because they're
# genuinely optional at runtime: install skewproof and you get a complete,
# working library; install skewproof[postgres] or skewproof[redis] and you also
# get the backend that needs them.
dependencies = []

[project.scripts]
skewproof = "skewproof.cli:entrypoint"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16",
    "hypothesis>=6.100",
]
postgres = [
    "psycopg2-binary>=2.9,<3",
]
redis = [
    "redis>=5,<9",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9,<10",
]

[tool.setuptools.packages.find]
include = ["skewproof*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, and import sorting: a solid baseline that
# catches real bugs without imposing a broader style migration (e.g.
# timezone-aware datetimes, typing modernization) as part of adding CI.
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=skewproof",
    "--cov-report=term-missing",
    "--cov-branch",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["skewproof"]

[tool.coverage.report]
show_missing = true
omit = ["skewproof/__init__.py"]
exclude_lines = [
    "pragma: no cover",
    # Protocol / interface method bodies that are never executed.
    "^\\s*\\.\\.\\.$",
]

[[tool.mypy.overrides]]
# psycopg2/redis are optional extras (postgres/redis), not installed in the
# base dev environment mypy runs in. doctor.py imports them dynamically to do
# real connectivity checks, which needs real client types - unlike
# sql_source.py/redis_store.py, which only need their Protocol shape and so
# never import them at all. ignore_missing_imports treats them as Any rather
# than failing the typecheck job over an intentionally-absent dependency.
module = ["psycopg2.*", "redis.*"]
ignore_missing_imports = true
